<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #fff;
        color: #111;
    }

    .logo {
        width: 180px;
        height: 70px;
        margin: 5px auto 0;
        text-align: center;
        position: relative;
        font-weight: bold;
        padding-top: 8px;
    }

    .logo span {
        font-size: 32px;
        letter-spacing: -2px;
    }

    .logo b {
        font-size: 18px;
        font-weight: normal;
        margin-left: 2px;
    }

    .smile {
        width: 55px;
        height: 16px;
        border-bottom: 4px solid #ff9900;
        border-radius: 50%;
        position: absolute;
        left: 62px;
        top: 40px;
        transform: rotate(-5deg);
    }

    .smile::after {
        content: "";
        position: absolute;
        right: -2px;
        bottom: -6px;
        width: 7px;
        height: 7px;
        border-right: 3px solid #ff9900;
        border-bottom: 3px solid #ff9900;
        transform: rotate(-10deg);
    }

    .main {
        min-height: 430px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .login-box {
        width: 418px;
        min-height: 362px;
        border: 1px solid #d5d9d9;
        border-radius: 8px;
        padding: 28px 32px;
        margin-top: 3px;
    }

    .login-box h1 {
        font-size: 25px;
        font-weight: 400;
        margin-bottom: 20px;
    }

    .login-box label {
        display: block;
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .login-box input {
        width: 100%;
        height: 42px;
        border: 1px solid #888;
        border-radius: 4px;
        padding: 8px;
        font-size: 17px;
        outline: none;
        margin-bottom: 14px;
    }

    .login-box input:focus {
        border: 2px solid #007eb9;
        box-shadow: 0 0 4px #00a8e1;
    }

    .login-box button {
        width: 100%;
        height: 39px;
        border: none;
        border-radius: 22px;
        background-color: #ffd814;
        font-size: 17px;
        cursor: pointer;
    }

    .login-box button:hover {
        background-color: #f7ca00;
    }

    .terms {
        font-size: 14px;
        line-height: 20px;
        margin-top: 18px;
    }

    .terms a,
    .business,
    .footer-links a {
        color: #0066c0;
        text-decoration: none;
    }

    .terms a:hover,
    .business:hover,
    .footer-links a:hover {
        text-decoration: underline;
    }

    .login-box hr {
        border: 0;
        border-top: 1px solid #ddd;
        margin: 17px 0 18px;
    }

    .login-box h3 {
        font-size: 16px;
        margin-bottom: 10px;
    }

    .business {
        font-size: 16px;
    }

    footer {
        border-top: 1px solid #d5d9d9;
        height: 150px;
        text-align: center;
        padding-top: 32px;
        margin-top: 15px;
    }

    .footer-links {
        display: flex;
        justify-content: center;
        gap: 32px;
        margin-bottom: 17px;
    }

    .footer-links a {
        font-size: 14px;
    }

    footer p {
        color: #555;
        font-size: 14px;
    }


    @media (max-width: 600px) {

        .logo {
            margin-top: 10px;
        }

        .main {
            min-height: auto;
            padding: 0 15px 30px;
        }

        .login-box {
            width: 100%;
            max-width: 418px;
            padding: 25px 22px;
        }

        .login-box h1 {
            font-size: 24px;
        }

        .login-box input {
            height: 44px;
        }

        .login-box button {
            height: 42px;
        }

        .terms {
            font-size: 13px;
        }

        .desktop-break {
            display: none;
        }

        footer {
            height: auto;
            min-height: 150px;
            padding: 28px 15px;
        }

        .footer-links {
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-links a {
            font-size: 13px;
        }

        footer p {
            font-size: 12px;
            line-height: 20px;
        }
    }
</style>

<body>
    <div class="logo">
        <img height="50vh" width="90%"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9ceM4oUZqAezwCA5QmctDgvNjg1s5_u5GtkLV-YhqaQ&s=10" />
    </div>

    <div class="main">

        <div class="login-box">

            <h1>Sign in or create account</h1>

            <label>Enter mobile number or email</label>

            <input type="text" autofocus>

            <button>Continue</button>

            <p class="terms">
                By continuing, you agree to Amazon's
                <a href="#">Conditions<br class="desktop-break"> of Use</a>
                and
                <a href="#">Privacy Notice</a>.
            </p>

            <hr>

            <h3>Buying for work?</h3>

            <a class="business" href="#">
                Create a free business account
            </a>

        </div>

    </div>

    <footer>

        <div class="footer-links">
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>

        <p>
            © 1996–2026, Amazon.com, Inc. or its affiliates
        </p>

    </footer>

</body>

</html>
