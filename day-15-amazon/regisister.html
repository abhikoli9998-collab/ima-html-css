<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #ffffff;
        color: #111111;
    }

    .register-container {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .logo {
        margin-top: 25px;
        margin-bottom: 20px;
        font-size: 32px;
        font-weight: bold;
        color: #111111;
    }

    .logo span {
        font-size: 16px;
        color: #111111;
    }

    .register-box {
        width: 350px;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 25px 26px;
        background-color: white;
    }

    .register-box h1 {
        font-size: 28px;
        font-weight: 400;
        margin-bottom: 22px;
    }

    .register-box label {
        display: block;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .register-box input {
        width: 100%;
        height: 42px;
        border: 1px solid #888;
        border-radius: 4px;
        padding: 10px;
        font-size: 15px;
        margin-bottom: 17px;
    }

    .register-box input:focus {
        outline: none;
        border: 2px solid #007185;
        box-shadow: 0 0 3px #007185;
    }

    .password-info {
        font-size: 12px;
        color: #555;
        margin-top: -10px;
        margin-bottom: 18px;
    }

    .register-box button {
        width: 100%;
        height: 40px;
        border: 1px solid #a88734;
        border-radius: 20px;
        background-color: #ffd814;
        color: #111;
        font-size: 14px;
        cursor: pointer;
        margin-top: 5px;
    }

    .register-box button:hover {
        background-color: #f7ca00;
    }

    .terms {
        font-size: 12px;
        line-height: 18px;
        margin-top: 22px;
        color: #333;
    }

    a {
        color: #0066c0;
        text-decoration: none;
    }

    a:hover {
        color: #c45500;
        text-decoration: underline;
    }

    .register-box hr {
        border: none;
        border-top: 1px solid #ddd;
        margin: 25px 0 20px;
    }

    .signin {
        font-size: 13px;
        color: #333;
    }

    .footer {
        width: 100%;
        text-align: center;
        margin-top: 35px;
        padding: 25px;
        border-top: 1px solid #ddd;
        background-color: #fafafa;
    }

    .footer a {
        font-size: 12px;
        margin: 0 12px;
    }

    .footer p {
        font-size: 12px;
        color: #555;
        margin-top: 18px;
    }

    @media (max-width: 700px) {

        .register-box {
            width: 90%;
            padding: 22px;
        }

        .logo {
            font-size: 28px;
        }

        .register-box h1 {
            font-size: 25px;
        }
    }
</style>

<body>

    <div class="register-container">

        <div class="logo">
            <img height="50vh" width="90%"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9ceM4oUZqAezwCA5QmctDgvNjg1s5_u5GtkLV-YhqaQ&s=10" />
        </div>

        <div class="register-box">
            <h1>Create Account</h1>

            <form>

                <label for="name">Your name</label>
                <input type="text" id="name" placeholder="First and last name">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 6 characters">

                <p class="password-info">
                    Password must be at least 6 characters.
                </p>

                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" placeholder="Re-enter your password">

                <button type="submit">Create your Amazon account</button>

            </form>

            <p class="terms">
                By creating an account, you agree to Amazon's
                <a href="#">Conditions of Use</a> and
                <a href="#">Privacy Notice</a>.
            </p>

            <hr>

            <p class="signin">
                Already have an account?
                <a href="#">Sign in</a>
            </p>
        </div>

        <div class="footer">
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
            <p>© 2026 Amazon Clone</p>
        </div>

    </div>

</body>

</html>
