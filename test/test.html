<!doctype html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myntra</title>
    <style>
        * {
            padding: 0%;
            margin: 0%;
            font-family: "Figtree", sans-serif;
            font-optical-sizing: auto;
            box-sizing: border-box;
        }

        #mainCnt {
            /* border: 3px solid blue; */
            width: 100%;
            height: 100vh;
        }

        #navCnt {
            border: 2px solid black;
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }

        #navLogoCnt {
            /* border: 3px solid green; */
            width: 12%;
            display: flex;
            height: 60px;
            /* flex-direction: column; */
            justify-content: center;
            align-items: center;
        }

        #navNaviCnt {
            /* border: 3px solid blue; */
            width: 37%;
            display: flex;
            justify-content: space-between;
        }

        #navSearchCnt {
            background-color: #f5f5f6;
            /* border: 3px solid blue; */
            width: 29%;
            height: 38px;
            border-radius: 3px;
            display: flex;
            align-items: center;
        }

        #navSearchCnt input {
            width: 50%;
            height: 50%;
            border: none;
            outline: none;
            background-color: #f1f1f1;
            align-items: center;
        }

        #navProfileCnt {
            /* border: 3px solid orange; */
            width: 12%;
            display: flex;
            justify-content: space-around;
        }

        #navProfileCnt div {
            /* border: 2px solid black; */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #navProfileCnt div p {
            font-size: 12px;
            font-weight: bold;
        }

        .imgstyle {
            margin-top: 5px;
            width: 60%;
            height: 60px;
        }

        .naviStyle {
            text-decoration: none;
            color: black;
            font-weight: 650;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .main-cnt {
            /* border: 2px solid red; */
            height: 100vh;
        }

        .flat-cnt {
            /* border: 2px solid red; */
            height: 20%;
            margin-top: 4%;
            margin-bottom: 4%;
        }

        .bag-cnt {
            /* border: 2px solid red; */
            height: 50%;
            /* padding: 10px; */
        }

        .adds-cnt {
            /* border: 2px solid blue; */
            height: 45%;
            display: flex;
        }

        .adds {
            /* border: 2px solid green; */
            height: 40vh;
            width: 25%;
        }
        
        @media (max-width: 700px) {
            #navCnt {
                display: flex;
                width: 130%;
            }

            #navNaviCnt {
                display: none;

            }

            .hideOnMobile {
                display: none;
            }

            #navLogoCnt {
                width: 20%;
                height: 60px;
                justify-content: flex-start;
            }

            #navLogoCnt img {
                width: 70%;
            }

            #navSearchCnt {
                width: 60%;
                height: 40px;
            }

            #navProfileCnt {
                width: 20%;
            }

            #navProfileCnt img {
                width: 25px;
                height: 25px;

            }

            #navProfileCnt p {
                font-size: 14px;
                font-weight: bold;
            }

            .main-cnt {
                width: 125%;
            }

            .flat-cnt {
                margin-bottom: -20%;
            }

            .bag-cnt {
                width: 100%;
                margin-bottom: -50%;
            }

            .adds-cnt {
                margin-bottom: -50%;
            }
        }
    </style>
</head>
